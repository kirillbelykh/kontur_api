[mypy]
python_version = 3.12
files = backend
exclude = (^\.venv/|^archive/|^runtime/|^tests/|^__pycache__/)
explicit_package_bases = True
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
; Мягкий гейт: код по большей части нетипизирован, поэтому шумные категории
; отключены глобально. Ужесточать per-module ([mypy-backend.services.*] и т.п.)
; по мере типизации; name-defined / call-arg / return-value остаются активны.
check_untyped_defs = False
disable_error_code = import-untyped, arg-type, assignment, union-attr, attr-defined, no-redef, dict-item, index, str-bytes-safe
